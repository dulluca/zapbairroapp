name: iOS - Build IPA (App Store)

# Gera o .ipa assinado, publica como artefato do run e entrega no TestFlight.
# Nenhum Mac e necessario: a API Key do App Store Connect faz o upload.
#
# Antes do primeiro uso, rode o workflow "iOS - Bootstrap de assinatura" uma vez
# e cadastre os secrets descritos em docs/IOS_DEPLOY.md. O app tambem precisa ja
# existir no App Store Connect, senao o upload nao encontra onde entregar.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (ex.: 1.0.1). Vazio = usa o valor do pubspec.yaml"
        required: false
        default: ""
      build_number:
        description: "Build number. Vazio = usa o do pubspec.yaml (hoje 7)"
        required: false
        default: ""
      enviar_para_testflight:
        description: "Entregar o build no TestFlight ao final"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: com.zapbairro.zapbairro
  FLUTTER_VERSION: 3.44.4
  # A Apple so aceita no App Store Connect app compilado com o SDK do iOS 26 ou
  # mais novo, que vem no Xcode 26. Nao volte para 'latest-stable' aqui: no
  # runner ele resolveu para o Xcode 16.4 (SDK 18.5), o build inteiro passou, e
  # a recusa so apareceu no upload -- "Validation failed (409) SDK version
  # issue. This app was built with the iOS 18.5 SDK."
  XCODE_VERSION: "26"
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  FASTLANE_HIDE_CHANGELOG: "true"
  # Caminhos absolutos: o fastlane resolve caminho relativo a partir de `ios/`,
  # o que ja causou confusao entre `ios/certs` e `ios/fastlane/certs`.
  IOS_PROJECT_DIR: ${{ github.workspace }}/ios
  IOS_CERTS_DIR: ${{ github.workspace }}/ios/fastlane/certs
  IOS_PROFILES_DIR: ${{ github.workspace }}/ios/fastlane/profiles
  IOS_IPA_DIR: ${{ github.workspace }}/build/ios/ipa
  IOS_LOGS_DIR: ${{ github.workspace }}/build/ios/logs

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir se os secrets obrigatorios existem
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          faltando=""
          for nome in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY \
                      APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            if [ -z "${!nome}" ]; then faltando="$faltando $nome"; fi
          done
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ] && [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            faltando="$faltando GOOGLE_SERVICE_INFO_PLIST"
          fi
          if [ -n "$faltando" ]; then
            echo "::error::Secrets faltando:$faltando. Veja docs/IOS_DEPLOY.md."
            exit 1
          fi
          echo "Todos os secrets obrigatorios estao presentes."

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Barreira barata: o build de iOS leva ~20 minutos e o erro de SDK so
      # aparece la no fim, na validacao da Apple. Aqui ele aparece no segundo 5.
      - name: Conferir a versao do SDK do iOS
        run: |
          set -euo pipefail
          echo "Xcodes disponiveis neste runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (nenhum em /Applications)"
          xcodebuild -version

          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK do iOS selecionado: $sdk"

          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::O App Store Connect recusa app compilado com SDK anterior ao do iOS 26. Este runner selecionou o SDK $sdk. Suba XCODE_VERSION no workflow, ou troque o 'runs-on' para um runner macOS que traga o Xcode 26."
            exit 1
          fi

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar Ruby e gems (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Instalar GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          set -euo pipefail
          destino=ios/Runner/GoogleService-Info.plist
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | tr -d '\n\r' | openssl base64 -d -A > "$destino"
            echo "GoogleService-Info.plist escrito a partir do secret."
          else
            echo "Usando o GoogleService-Info.plist versionado no repositorio."
          fi

          # O app chama Firebase.initializeApp() sem opcoes, entao ele depende
          # 100% deste arquivo. Se o BUNDLE_ID nao bater, o app abre e crasha.
          gsi_bundle=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$destino")
          if [ "$gsi_bundle" != "$IOS_BUNDLE_ID" ]; then
            echo "::error::GoogleService-Info.plist e do bundle '$gsi_bundle', mas o app e '$IOS_BUNDLE_ID'. Registre o app iOS no Firebase com o bundle correto e baixe o plist de novo."
            exit 1
          fi
          echo "GoogleService-Info.plist confere com $IOS_BUNDLE_ID."

      - name: Conferir bundle id do projeto Xcode
        run: |
          set -euo pipefail
          if grep -q "PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;" ios/Runner.xcodeproj/project.pbxproj; then
            echo "Bundle id do Runner confere."
          else
            echo "::error::O Runner.xcodeproj nao esta com PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID."
            exit 1
          fi

      - name: Instalar certificado de distribuicao
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        run: |
          set -euo pipefail
          mkdir -p ios/fastlane/certs
          printf '%s' "$IOS_DIST_CERT_P12" | tr -d '\n\r' | openssl base64 -d -A > ios/fastlane/certs/distribution.p12
          # Senha aleatoria e efemera: a keychain existe so durante este job.
          echo "KEYCHAIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: flutter pub get
        run: flutter pub get

      - name: Definir version e build number
        env:
          IN_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          IN_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          numero="${IN_BUILD_NUMBER:-}"

          # Sem valor no dispatch, manda o pubspec.yaml: e onde o numero fica
          # versionado e revisavel. O numero do run so entra como ultimo
          # recurso, porque ele nao sabe qual build ja foi entregue a Apple --
          # e build number repetido faz o upload ser recusado.
          if [ -z "$numero" ]; then
            # || true: com pipefail, um grep sem resultado derrubaria o passo.
            linha=$(grep -E '^version:' pubspec.yaml | head -1 || true)
            case "$linha" in
              *+*) numero=$(echo "${linha##*+}" | tr -d '[:space:]') ;;
            esac
          fi
          if [ -z "$numero" ]; then numero="$RUN_NUMBER"; fi
          echo "BUILD_NUMBER=$numero" >> "$GITHUB_ENV"

          nome="${IN_VERSION:-}"
          if [ -z "$nome" ] && [ "$REF_TYPE" = "tag" ]; then
            nome="${GITHUB_REF_NAME#v}"
          fi
          echo "BUILD_NAME=$nome" >> "$GITHUB_ENV"
          echo "Build number: $numero / version: ${nome:-<pubspec>}"

      - name: Compilar o app Flutter
        run: |
          set -euo pipefail

          # Os plugins deste app entram como Swift Packages. Se um Podfile
          # reaparecer, o `flutter build ios` integra CocoaPods num projeto que
          # nao usa pods e o xcodebuild falha em "The sandbox is not in sync
          # with the Podfile.lock" — melhor barrar aqui, com a causa na tela.
          if [ -f ios/Podfile ]; then
            echo "::error::ios/Podfile voltou a existir. Este projeto usa Swift Package Manager (ver packageReferences no Runner.xcodeproj); apague o Podfile ou migre o projeto de volta para CocoaPods por inteiro."
            exit 1
          fi

          # Explicito para nao depender do padrao da versao do Flutter: o
          # Runner.xcodeproj referencia o pacote gerado em
          # Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage, que
          # so e criado com o SPM ligado.
          flutter config --enable-swift-package-manager

          args="--release --no-codesign --build-number=$BUILD_NUMBER"
          if [ -n "${BUILD_NAME:-}" ]; then args="$args --build-name=$BUILD_NAME"; fi
          flutter build ios $args

      - name: Assinar e exportar o IPA
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: bundle exec fastlane ios build_ipa

      - name: Publicar o IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ZapBairro-ios-${{ env.BUILD_NUMBER }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/*.app.dSYM.zip
          if-no-files-found: error
          retention-days: 30

      # Depois do upload do artefato de proposito: se a entrega na Apple falhar,
      # o .ipa ja esta salvo no run e da para reenviar sem recompilar.
      # Em push de tag `inputs` vem vazio, entao a primeira clausula liga o envio.
      - name: Entregar o build no TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.enviar_para_testflight }}
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: bundle exec fastlane ios upload_testflight

      - name: Publicar logs de build (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            build/ios/logs/**
            ios/fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Limpar credenciais do runner
        if: always()
        run: rm -rf ios/fastlane/certs ios/fastlane/profiles
